<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <header>
        <h1>Student Registration Form</h1>
        <p>Please fill in your details below.</p>
    </header>

    <main>
        <form action="#" method="post">

            <fieldset>
                <legend>Student Information</legend>

                <div>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname"
                           placeholder="Enter your full name" required>
                </div>

                <br>

                <div>
                    <label for="matric">Matric Number:</label>
                    <input type="text" id="matric" name="matric"
                           placeholder="Enter your matric number" required>
                </div>

                <br>

                <div>
                    <label for="level">Level:</label>
                    <select id="level" name="level" required>
                        <option value="">Select your level</option>
                        <option value="100">100 Level</option>
                        <option value="200">200 Level</option>
                        <option value="300">300 Level</option>
                        <option value="400">400 Level</option>
                        <option value="500">500 Level</option>
                    </select>
                </div>

                <br>

                <div>
                    <label for="department">Department:</label>
                    <select id="department" name="department" required>
                        <option value="">Select your department</option>
                        <option value="ICT">Information and Communication Technology</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Software Engineering">Software Engineering</option>
                        <option value="Cybersecurity">Cybersecurity</option>
                        <option value="Information Systems">Information Systems</option>
                        <option value="Computer Engineering">Computer Engineering</option>
                        <option value="Data Science">Data Science</option>
                    </select>
                </div>

                <br>

                <div>
                    <label for="college">College:</label>
                    <input type="text" id="college" name="college"
                           placeholder="Enter your college" required>
                </div>

                <br>

                <button type="submit">Register</button>
            </fieldset>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Student Registration Form</p>
    </footer>

</body>
</html>
